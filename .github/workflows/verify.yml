name: Verify Userscript & Metadata Sync

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check antigravity-zh-cn.user.js
      - run: node scripts/verify-and-sync.mjs
